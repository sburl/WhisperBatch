name: Swift
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Safe to overlap: brew writes only under /opt/homebrew (already on PATH),
      # while swift build/test use .build; build-local.sh waits for xcodegen.
      - id: install-xcodegen
        background: true
        run: brew install xcodegen
      - run: swift --version
      - run: swift build
      - run: swift test
      - wait: install-xcodegen
      - run: ./build-local.sh
